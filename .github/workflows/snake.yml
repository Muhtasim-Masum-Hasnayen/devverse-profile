name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["config.yml"]

permissions:
  contents: write

jobs:
  snake:
    # skip in the template repo itself; runs in every user's profile repo
    if: github.repository != 'Muhtasim-Masum-Hasnayen/devverse-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read theme colours
        id: theme
        run: node scripts/print-theme.js
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=${{ steps.theme.outputs.snake }}&color_dots=${{ steps.theme.outputs.dots }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
