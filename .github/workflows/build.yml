name: Build Profile

on:
  push:
    paths: ["config.yml"]
  schedule:
    - cron: "0 */6 * * *"      # refresh joke / assets every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate README + animated assets
        run: node scripts/generate.js
      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: rebuild profile [skip ci]"
            git push
          fi
